name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset (deterministic sample for CI)
        run: |
          mkdir -p data/raw
          curl -fsSL https://raw.githubusercontent.com/plotly/datasets/master/diabetes.csv -o data/raw/diabetes.csv

      - name: Train models (small, so the API tests have artifacts)
        run: |
          # The full training is fast (a few seconds); run it to produce
          # the artifacts the API tests require.
          python scripts/train_all.py

      - name: Run tests
        run: |
          python -m pytest tests/ -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check & build
        run: npm run build
        working-directory: frontend
